# @package _global_
defaults:
- override /model: g05
- override /tokenizer: actioncodec
- override /data: libero
- _self_
datastatics_path: /efm-nas/efm-nas/group-jt/dataset_stats_0520_b1k.json
model:
  pretrained_ckpt: OpenGalaxea/G05/g05-base/checkpoints/model_state_dict.pt
  use_torch_compile: false
  use_8bit_optimizer: false
  batch_size: 8
  max_epochs: null
  max_steps: 100000
  learning_rate: 1.0e-05
  backbone_lr_multiplier: 1.0
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  warmup_steps: 1000
  num_workers: 8
  find_unused_parameters: true
  model_arch:
    position_ids_type: pi0fast
    checkpoint_joint: false
    checkpoint_vision: false
    checkpoint_action_decoder: false
    # Match the g05-base pretraining layout. LIBERO's missing left/lower-body
    # groups are padded and then omitted from AR targets as no-op parts.
    action_dim: 27
    proprio_dim: 27
    discrete_action: true
    continuous_action: false
    fm:
      joint_training: true
      fm_weight: 0.0
      num_flow_samples: 8
    ar:
      ce_weight: 1.0
  processor:
    num_output_cameras: 2
    num_input_cameras: 2
    camera_size_config:
      exterior:
      - 256
      - 256
      wrist_left:
      - 256
      - 256
      wrist_right:
      - 256
      - 256
    norm_default_mode: q01/q99
    vlm_input_action_norm_default_mode: null
    vlm_input_action_norm_exception_mode: null
    tokenizer_params:
      local_files_only: true
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,merge_spec}
      merge: true
tokenizer:
  vq_config:
    ckpt_dir: OpenGalaxea/G05/action_tokenizer.pt
    block_wise_autoregressive: false
    model_arch:
      codebook_size: 4096
    num_residuals: 2
    rule_based_key_patterns:
    - gripper
    rule_based_binarize_threshold: 0.0
    use_group_markers: true
    group_order_shuffle: false
    absent_key_fill_value: -100.0
    dropout_noop_parts: true
    # Keep the complete five-group vocabulary used by g05-base. Removing this
    # group shifts later marker IDs even when LIBERO never emits lower-body tokens.
    parts_meta:
      left_control: 9
      left_gripper: 1
      right_control: 9
      right_gripper: 1
      lower_body: 7
